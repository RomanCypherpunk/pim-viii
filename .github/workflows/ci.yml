name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: alunostech-hub

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci#Pass2026Strong!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci#Pass2026Strong!' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar e compilar
        run: dotnet build AlunosTechHub.slnx -c Release -p:EnableWindowsTargeting=true
      - name: Testes unitarios com cobertura
        run: dotnet test tests/AlunosTech.Domain.Tests -c Release --collect:"XPlat Code Coverage" --logger "trx"
      - name: Validar scripts SQL (migracao do zero em SQL Server real)
        env:
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__Default: "Server=localhost,1433;Database=AlunosTech;User Id=sa;Password=Ci#Pass2026Strong!;TrustServerCertificate=True;Encrypt=False"
          Jwt__Key: "chave-de-ci-com-mais-de-trinta-e-dois-caracteres"
        run: |
          dotnet run --project src/AlunosTech.Api -c Release --no-build --no-launch-profile &
          for i in $(seq 1 40); do curl -sf http://localhost:5000/health/ready && break; sleep 2; done
          curl -sf http://localhost:5000/health/ready
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "alunostech-hub/**/TestResults/**"

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alunostech-hub/mobile/alunostech_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o gitleaks varre o intervalo de commits do push
      - name: Build da imagem
        run: docker build -f infra/docker/Dockerfile.api -t alunostech-api:${{ github.sha }} .
      - name: Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: alunostech-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
      - name: Scan de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Login no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagem
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/alunostech-api
          docker tag alunostech-api:${{ github.sha }} $IMG:${{ github.sha }}
          docker tag alunostech-api:${{ github.sha }} $IMG:latest
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest
